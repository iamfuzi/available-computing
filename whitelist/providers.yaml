version: "2026.05.07"
updated_at: "2026-05-07"

providers:
  groq:
    free_strategy: all
    free_type: permanent
    notes: "Groq 全部模型当前永久免费，各模型速率限制不同"

  siliconflow:
    free_strategy: whitelist
    free_models:
      # NOTE: SiliconFlow's charging_type=free API param is silently ignored
      # (returns ALL models incl. paid), so free detection relies on this
      # manually-curated whitelist + the Pro/ prefix rule in the adapter.
      # Models here were verified free; the list is pruned of retired entries.
      # Non-Pro/ models not listed here are treated as unknown (not free).
      - id: "Qwen/Qwen2.5-7B-Instruct"
        free_type: permanent
        notes: "永久免费"
      - id: "Qwen/Qwen2.5-14B-Instruct"
        free_type: permanent
      - id: "Qwen/Qwen2.5-72B-Instruct"
        free_type: permanent
      - id: "BAAI/bge-m3"
        free_type: permanent
        category: embedding
      - id: "BAAI/bge-large-zh-v1.5"
        free_type: permanent
        category: embedding
      - id: "BAAI/bge-large-en-v1.5"
        free_type: permanent
        category: embedding
      - id: "BAAI/bge-reranker-v2-m3"
        free_type: permanent
        category: rerank
      # NOTE: "Pro/" prefixed models are paid per SiliconFlow convention
      # (free variants keep the original name). They are excluded from this
      # whitelist; detect_free_from_api enforces the prefix rule instead.
      - id: "Qwen/Qwen3-Embedding-0.6B"
        free_type: permanent
        category: embedding
      - id: "Qwen/Qwen3-Embedding-4B"
        free_type: permanent
        category: embedding
      - id: "Qwen/Qwen3-Embedding-8B"
        free_type: permanent
        category: embedding
      - id: "Qwen/Qwen3-Reranker-0.6B"
        free_type: permanent
        category: rerank
      - id: "Qwen/Qwen3-Reranker-4B"
        free_type: permanent
        category: rerank
      - id: "Qwen/Qwen3-Reranker-8B"
        free_type: permanent
        category: rerank

  agnes:
    free_strategy: whitelist
    free_models:
      - id: "agnes-2.0-flash"
        free_type: permanent
        rate_limit:
          rpm: 30
        notes: "文本+图像理解，512K上下文，当前 $0/1M tokens 免费。同一 key 所有模型共享 RPM 配额池"
      # Only agnes-2.0-flash is whitelisted:
      # - agnes-1.5-flash: free status not confirmed in docs.
      # - agnes-image-* / agnes-video-*: generation models that reject chat
      #   requests; probing them would fail and burn the shared RPM budget.
      # param_size intentionally omitted: Agnes does not publish it, and the
      # id carries no <n>b marker, so auto:smart (size-sorted) deprioritizes
      # it. auto:fast / auto:text (latency-sorted) are unaffected. Category
      # stays text by convention (single category per model, like GLM Flash).

  zhipu:
    free_strategy: whitelist
    free_models:
      - id: "glm-4.7-flash"
        free_type: permanent
        param_size: 130
        notes: "200K 上下文，免费"
      - id: "glm-4-flash"
        free_type: permanent
        param_size: 130
        notes: "128K 上下文，免费"
      - id: "glm-z1-flash"
        free_type: permanent
        param_size: 130
        notes: "推理模型，免费"
      - id: "glm-4.6v-flash"
        free_type: permanent
        category: vision
        notes: "多图理解，免费"
      - id: "glm-4v-flash"
        free_type: permanent
        category: vision
        notes: "单图理解，免费"
      - id: "cogvideox-flash"
        free_type: permanent
        category: video
        notes: "视频生成，免费"
      - id: "cogview-3-flash"
        free_type: permanent
        category: image
        notes: "图像生成，免费"
      - id: "glm-4.1v-thinking-flash"
        free_type: permanent
        category: vision
        notes: "视觉推理，免费"
