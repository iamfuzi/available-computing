version: "2026.09.29"
updated_at: "2026-09-29"

providers:
  groq:
    free_strategy: all
    free_type: permanent
    notes: "Groq 全部模型当前永久免费，各模型速率限制不同"

  siliconflow:
    free_strategy: whitelist
    free_models:
      # NOTE: SiliconFlow's charging_type=free API param is silently ignored
      # (returns ALL models incl. paid), so free detection relies on this
      # manually-curated whitelist + the Pro/ prefix rule in the adapter.
      # Models here were verified free; the list is pruned of retired entries.
      # Non-Pro/ models not listed here are treated as unknown (not free).
      - id: "Qwen/Qwen2.5-7B-Instruct"
        free_type: permanent
        notes: "永久免费（2026-09-29 账单核实：7.07M tokens 实收 ¥0；同账单中 14B/72B 及全部 LoRA/ 变体均在收费）"
        # REMOVED 2026-09-29 (billing evidence): Qwen/Qwen2.5-14B-Instruct and
        # Qwen/Qwen2.5-72B-Instruct appeared as PAID lines in the SiliconFlow
        # bill while AC still routed/probed them as free. They are no longer
        # whitelisted; discovery now marks them unknown (never probed, never
        # routed). Re-add only with fresh official confirmation of free status.
      - id: "BAAI/bge-m3"
        free_type: permanent
        category: embedding
      - id: "BAAI/bge-large-zh-v1.5"
        free_type: permanent
        category: embedding
      - id: "BAAI/bge-large-en-v1.5"
        free_type: permanent
        category: embedding
      - id: "BAAI/bge-reranker-v2-m3"
        free_type: permanent
        category: rerank
      # NOTE: "Pro/" prefixed models are paid per SiliconFlow convention
      # (free variants keep the original name). They are excluded from this
      # whitelist; detect_free_from_api enforces the prefix rule instead.
      - id: "Qwen/Qwen3-Embedding-0.6B"
        free_type: permanent
        category: embedding
      - id: "Qwen/Qwen3-Embedding-4B"
        free_type: permanent
        category: embedding
      - id: "Qwen/Qwen3-Embedding-8B"
        free_type: permanent
        category: embedding
      - id: "Qwen/Qwen3-Reranker-0.6B"
        free_type: permanent
        category: rerank
      - id: "Qwen/Qwen3-Reranker-4B"
        free_type: permanent
        category: rerank
      - id: "Qwen/Qwen3-Reranker-8B"
        free_type: permanent
        category: rerank

  agnes:
    free_strategy: whitelist
    free_models:
      - id: "agnes-3.0-flash"
        free_type: permanent
        rate_limit:
          rpm: 10
        notes: "2026-09 官方文档升级后的当前免费文本线。免费档 RPM≈10（用户实测口径），同一 key 所有模型共享配额池"
      - id: "agnes-2.5-flash"
        free_type: permanent
        rate_limit:
          rpm: 10
        notes: "官方 Agnes-help-skill 变更记录点名的现行文本模型（与 3.0-flash 同批）；轻量、面向编码/Agent 工作流"
      # 仍不白名单：
      # - agnes-2.0-flash / agnes-1.5-flash: 官方在售线已升级至 2.5/3.0-flash，
      #   旧线移出白名单（2026-09-30，用户对齐官方控制台）。
      # - agnes-2.5-pro(-alpha/-beta): 免费状态未获官方确认。
      # - agnes-image-* / agnes-video-*: 生成类模型拒绝 chat 请求；探测它们
      #   只会失败并烧掉共享 RPM 配额（≈10/分钟）。
      # param_size intentionally omitted: Agnes does not publish it, and the
      # id carries no <n>b marker, so auto:smart (size-sorted) deprioritizes
      # it. auto:fast / auto:text (latency-sorted) are unaffected. Category
      # stays text by convention (single category per model, like GLM Flash).

  zhipu:
