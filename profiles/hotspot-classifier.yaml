# Routing profile for the hotspot-classifier caller (hotspot-pipeline project).
#
# This profile captures the routing constraints that the hotspot classification
# service previously maintained client-side: free text models only, exclude
# Google/Gemini and a few model families, and bound the fallback chain so a
# single request fans out across providers rather than burning one provider's
# quota. See profiles/README.md for the full field reference.

# Only route to free channels. Set false to allow paid models as a last-resort
# fallback (a paid-model escape hatch granted by the profile, not by callers).
free_only: true

# Whole-provider exclusions. These are HARD filters: no candidate from a
# denied provider can enter the pool, and the fallback chain cannot bypass
# them. Provider ids match channel.provider_type (e.g. openrouter, groq,
# siliconflow, zhipu, agnes).
provider_denylist:
  - google
  - gemini

# Model-id substring exclusions (case-insensitive). Applied per candidate,
# also as a hard filter. Use this for model families you never want, regardless
# of which provider hosts them.
model_deny_patterns:
  - gemini
  - glm-z1
  - kilo-auto
  - content-safety
  - reasoning

# Fallback budget within a single request. max_attempts caps total upstream
# tries; max_attempts_per_provider forces the fallback chain to spread across
# providers (e.g. A -> B -> C) instead of exhausting one provider first
# (A -> A -> A), since models on the same provider often share quota and
# failure domains.
max_attempts: 3
max_attempts_per_provider: 1

# Hard wall-clock deadline for the whole request. Each upstream try gets at
# most deadline_ms / max_attempts seconds before timing out, so three fallback
# tries cannot accumulate into a multi-minute hang. If the deadline cannot be
# met, AC fails fast instead of making the caller wait.
deadline_ms: 45000
